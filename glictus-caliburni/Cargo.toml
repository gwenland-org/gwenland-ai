[package]
name = "glictus-caliburni"
version = "0.1.163"
edition = "2024"
description = "GLLM (GwenLand Language Model Format) — Ictus Caliburni"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
# ARTX05/06 runtime: layer files are mapped, not read. Pinned to the same
# version glcore uses. A thin OS wrapper (mmap/CreateFileMapping), not an ML
# dependency — the zero-ML-deps rule is intact.
memmap2 = "0.9"
# Converter-only (ARTX07): the core format library stays zero-workspace-dep;
# `glcore` is pulled in only when the `converter` feature is enabled.
glcore = { path = "../glcore", optional = true }
# CPU execution backend (ARTX10 Wave 1): forwards ExecutionBackend::execute_layer
# to glproc's per-op kernels. Optional so the format/runtime crate stays
# engine-agnostic by default — only a caller that wants to actually run
# inference pulls glproc in.
glproc = { path = "../glproc", optional = true }

[features]
default = []
# G-Quant (Pridwen v5, §8): DType::GQ4A + GQ4ABlock struct definitions only —
# no encoder, no glcore dep. Pulled in automatically by `converter`, since the
# encoder needs the block struct, but can be enabled standalone for anything
# that only needs to read/describe the format (e.g. a future dequant-only
# consumer that doesn't want glcore).
gquant = []
# Pridwen Phase 2 ADR (architecture/Pridwen-P2-ADR-glproc-dequant.md): glcore's
# dequantize() deliberately excludes Q4_K/Q5_0 ("dequant lives in glproc").
# converter needs those two dtypes decoded to F32 to re-encode them as GQ4A,
# so it pulls in glproc's already-proven scalar dequant kernels rather than
# duplicating that logic in glcore. Same directional pattern as
# glproc-backend (glictus-caliburni -> glproc, never the reverse).
converter = ["dep:glcore", "dep:glproc", "gquant"]
# glproc adapter needs glcore's tensor decoder (ARTX10 Wave 1's gllm.rs) too.
glproc-backend = ["dep:glproc", "dep:glcore"]

[[bin]]
name = "glconv"
required-features = ["converter"]

[dev-dependencies]
tempfile = "3"
serde_json = "1"
