[workspace]
members = [
    "glcore",
    "glproc",
    "glcuda",
    "glvulkan",
    "glmetal",
    "glbench",
    "glcli",
    "gljax",
    "glserve",
    "glictus-caliburni",
    "packages/mcp",
]

# `.abandoned/` holds retired crates kept for reference only. They are not
# workspace members and are not built: gltui was a TUI over the legacy
# `gwenland` stack that never called the GL engines (its CoreBridge was a
# stub), retired 2026-07-18.
#
# `gltrain/` (Stummañ) is GwenLand's training arm and stays under active
# development. It is excluded because the training crate is allowed
# dependencies the "Inference First" rule forbids in the inference tree, and
# because keeping it out means `cargo build --workspace` never compiles it —
# verified, not assumed. It declares its own `[workspace]`, so it is its own
# workspace root with its own Cargo.lock; build it with `cargo build` from
# inside `gltrain/`.
#
# NOTE: it must appear here even though it declares `[workspace]` itself.
# Without this entry, `glbench`'s optional `gltrain = { path = "../gltrain" }`
# fails with "multiple workspace roots found in the same workspace".
#
# The candle-based crate that previously occupied this path (package
# `gwenland-core`, ~31k lines, 381 crates in its tree) was deleted 2026-08-20.
# It had no live consumers and glbench v3 chose Stummañ over it as the
# training arm to observe (design finding F-01).
exclude = [".abandoned", "gltrain"]
resolver = "2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The inference hot path must be optimized for speed, not size — "z" would
# undo the M1.5 SIMD/threading work. Everything else stays size-optimized.
[profile.release.package.glproc]
opt-level = 3

[profile.release.package.glcore]
opt-level = 3
