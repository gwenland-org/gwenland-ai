[workspace]
members = [
    "glcore",
    "glproc",
    "glcuda",
    "glvulkan",
    "glmetal",
    "glbench",
    "glcli",
    "gljax",
    "glserve",
    "glictus-caliburni",
    "packages/mcp",
]

# `.abandoned/` holds retired crates kept for reference only. They are not
# workspace members and are not built: gltui was a TUI over the legacy
# `gwenland` stack that never called the GL engines (its CoreBridge was a
# stub), retired 2026-07-18.
#
# `gltrain/` (formerly `packages/core`) is excluded for a different reason —
# it is NOT retired, it is GwenLand's training arm and stays under active
# development. It is excluded because it mandatorily depends on candle
# (candle-core/candle-nn/candle-transformers, "always compiled since Cycle
# 6"), which violates this workspace's "Inference First" rule of zero
# external ML dependencies (see
# gl-agent-skills/architecture-skills/inference-first.md, Rule 6). Keeping it
# excluded means `cargo build/check --workspace` at the root never touches
# candle; build gltrain on its own with `cargo build` from inside `gltrain/`
# — it is its own independent workspace with its own Cargo.lock.
exclude = [".abandoned", "gltrain", "stumman"]
resolver = "2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The inference hot path must be optimized for speed, not size — "z" would
# undo the M1.5 SIMD/threading work. Everything else stays size-optimized.
[profile.release.package.glproc]
opt-level = 3

[profile.release.package.glcore]
opt-level = 3
