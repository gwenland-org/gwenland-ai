## Build + test the workspace on every push and PR.
#
# This workflow answers one question: does the code compile and do the tests
# pass? It builds no release artifacts and publishes nothing — build.yml owns
# releases, and the e2e-* workflows own end-to-end product flows.
#
# No exclusions. This file previously carved out two pre-existing breaks and
# said "when either is fixed, delete its exclusion below" — both are now fixed,
# so both carve-outs are gone:
#
#   * glcli's E0063 (`InferInput`'s `trace` field) no longer reproduces; the
#     crate builds and is covered by `--workspace` like everything else.
#
#   * glcuda's `forward` test asserted `LayerWeights` fields `gate_up`/`w_down`
#     (E0560). Those were not deleted, they moved into `FfnLayer::Dense` when
#     the FFN grew its routed-MoE variant; the test now constructs that and the
#     whole crate's 59 tests run here.
#
# Keep it that way: if an exclusion list reappears and grows, that is the
# signal to stop and fix the tree instead.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the others: Linux and macOS have
      # historically broken on cfg-gated code that never compiles on Windows.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Build and test are separate steps so a compile error and a failing
      # assertion are distinguishable at a glance in the job list.
      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Run tests
        run: cargo test --workspace --locked
