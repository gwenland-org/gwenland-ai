name: ✨ Feature request
description: Propose a new capability, model architecture, backend, or improvement.
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the need, not just the solution. "I want to run model X on hardware Y" beats "add kernel Z".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to happen. Rough sketches welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of the stack?
      options:
        - glcore (parsers / tokenizer / runtime)
        - glproc (CPU engine)
        - glcuda (CUDA engine)
        - glvulkan / glmetal (planned backends)
        - glbench (profiling / benchmarking)
        - glcli / gltui (interface)
        - other / not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about, and why they fall short.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, papers, reference implementations, target hardware, measurements.
