[package]
name = "glcore"
version = "0.1.163"
edition = "2021"
description = "GwenLand AI core: shared types, traits, format parsers, tokenizer"
license-file = "../LICENSE"

[dependencies]
thiserror = "1"
memmap2 = "0.9"
byteorder = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The tokenizer. No cycle: gltokenizer does not depend on glcore.
gltokenizer = { path = "gltokenizer" }

[dev-dependencies]
tempfile = "3"
