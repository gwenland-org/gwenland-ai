name = "moe_threads"
harness = false

[[bench]]
name = "attn_probe"
harness = false

[[bench]]
name = "q4k_probe"
harness = false

[[bench]]
name = "q4k_regime"
harness = false

[[bench]]
name = "vnni512_probe"
harness = false

[[bench]]
name = "row_tile_probe"
harness = false

[[bench]]
name = "rope_probe"
harness = false

[[bench]]
name = "elementwise_add_probe"
harness = false
